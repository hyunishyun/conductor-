<script>
'use strict';
/* =====================================================================
   CONDUCTOR v0.4 — modules
   Log       verification log (dev overlay: key D, or #dev in the URL)
   Score     the original melody and harmony
   Audio     sample engine (pre-rendered sprite) + synth fallback, buses, voice budget
   Clock     shared musical clock (lookahead scheduler, tempo, ritardando)
   Layers    instrument sections that read the same step counter
   Gestures  animated hand guide: big demo, docked icons, input feedback
   Visual    canvas rendering: musicians, baton, rings, trails, particles
   Nav       history entry so a system Back closes popups instead of the app
   Input     keyboard + opt-in pointer drag + history back → abstract actions
   Game      the six chapters (state machine)
   Dev       overlay for verifying audio/clock behaviour
   ===================================================================== */
const VERSION = '0.4.0';
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---------------- Log ---------------- */
const Log = {
  lines: [], t0: performance.now(),
  add(msg) {
    const t = ((performance.now() - this.t0) / 1000).toFixed(2).padStart(6);
    this.lines.push(`${t}s  ${msg}`);
    if (this.lines.length > 80) this.lines.shift();
  }
};

/* ---------------- Score ---------------- */
/* An original two-bar melody in D major (16 steps per bar, 4 per beat). */
const Score = {
  melody: [
    { n: 74, len: 4 }, { n: 76, len: 4 }, { n: 78, len: 4 }, { n: 81, len: 4 },
    { n: 83, len: 6 }, { n: 81, len: 2 }, { n: 78, len: 4 }, { n: 74, len: 4 }
  ],
  chords: [
    { name: 'D',  root: 50, tones: [62, 66, 69] },
    { name: 'Bm', root: 47, tones: [62, 66, 71] },
    { name: 'G',  root: 43, tones: [62, 67, 71] },
    { name: 'A',  root: 45, tones: [61, 64, 69] }
  ],
  chordAtBar(bar) { return this.chords[((bar % 4) + 4) % 4]; }
};
Score.melodyStarts = (() => { let s = 0; return Score.melody.map(m => { const o = s; s += m.len; return o; }); })();

/* ---------------- Audio ---------------- */
/* v0.3: two engines behind one API.
   SAMPLES (default): every note, chord and the final chord were pre-rendered from the
   synth below, with the hall reverb baked in, into one MP3 sprite. At runtime a note is
   one AudioBufferSourceNode + one GainNode reading a region of that shared buffer.
   No oscillators, no live reverb, no vibrato LFOs, no per-note filters.
   SYNTH (fallback): the v0.2 synthesizer, used only if the sprite cannot be loaded.
   Its reverb and vibrato LFOs are built lazily, on the first synth note. */
const SAMPLE_MAKEUP = 1.55;   /* +3.8 dB, matched against the v0.2 synth by measurement */
const SPRITE = /*SPRITE-MAP*/{"url":"conductor-audio-v3.mp3","rate":32000,"marker":0.05,"map":{"solo_74":[0.35,3.13,0.72139],"solo_76":[3.52998,3.13,0.71904],"solo_78":[6.70996,3.2227,0.7187],"solo_81":[9.98263,3.1751,0.73101],"solo_83":[13.20771,3.1299,0.74577],"solo_86":[16.38758,3.13,0.72462],"soloOct_74":[19.56756,3.13,0.68267],"soloOct_76":[22.74754,3.13,0.68127],"soloOct_78":[25.92752,3.1299,0.68135],"soloOct_81":[29.10746,3.1299,0.68155],"soloOct_83":[32.28737,3.13,0.68179],"pad_D":[35.46735,5.4023,0.63086],"padHi_D":[40.91969,3.2198,0.18297],"brassPair_D":[44.1895,1.3072,0.14356],"brassL_D":[45.54671,1.698,0.29733],"brassM_D":[47.29475,1.2216,0.21436],"brassS_D":[48.56631,0.9819,0.21409],"pad_Bm":[49.59821,5.3802,0.56108],"padHi_Bm":[55.0284,3.0843,0.18192],"brassPair_Bm":[58.16273,1.2426,0.14969],"brassL_Bm":[59.45529,1.3886,0.23314],"brassM_Bm":[60.89388,1.2188,0.1643],"brassS_Bm":[62.16269,1.0636,0.16443],"pad_G":[63.27633,5.3878,0.54844],"padHi_G":[68.71417,3.1409,0.17247],"brassPair_G":[71.90504,1.4163,0.15218],"brassL_G":[73.37133,1.6016,0.23757],"brassM_G":[75.0229,1.2416,0.17496],"brassS_G":[76.3145,0.8152,0.16462],"pad_A":[77.17969,5.3005,0.59859],"padHi_A":[82.53021,3.116,0.17704],"brassPair_A":[85.69621,1.3072,0.15095],"brassL_A":[87.0534,1.504,0.22814],"brassM_A":[88.60738,1.284,0.16424],"brassS_A":[89.94142,0.9573,0.15983],"smel_62":[90.94869,2.6069,0.10297],"smel_64":[93.60556,2.7085,0.0992],"smel_66":[96.36404,2.6373,0.09868],"smel_69":[99.05137,2.6123,0.10113],"smel_71":[101.71371,2.6367,0.1034],"windsL_73":[104.40044,1.2542,0.15087],"windsS_73":[105.70465,0.9134,0.13615],"windsL_74":[106.668,1.0499,0.14895],"windsS_74":[107.7679,0.9532,0.13717],"windsL_76":[108.77112,1.2786,0.15421],"windsS_76":[110.09975,0.8829,0.13414],"windsL_78":[111.03269,1.2083,0.15473],"windsS_78":[112.291,0.764,0.13138],"windsL_79":[113.10502,1.0168,0.15678],"windsS_79":[114.17179,0.838,0.13275],"windsL_81":[115.05981,1.3175,0.14857],"windsS_81":[116.42731,0.7832,0.13685],"windsL_83":[117.26048,1.3111,0.15208],"windsS_83":[118.62162,1.1422,0.13097],"windsL_85":[119.81381,1.0085,0.15458],"windsS_85":[120.87235,0.985,0.13499],"windsL_86":[121.90731,1.0506,0.16019],"windsS_86":[123.00787,0.8533,0.13336],"timp_38":[123.91121,1.53,1.01117],"timp_35":[125.49119,1.5291,1.01432],"timp_31":[127.07029,1.53,1.023],"timp_33":[128.65027,1.53,1.02265],"final":[130.23025,6.2934,1.90105]}}/*END-SPRITE-MAP*/;
const Audio = (() => {
  let ctx = null, master = null, duck = null, direct = null, reverb = null, noiseBuf = null;
  const bus = {};
  const BUS = {
    /* cap = sounding notes per section in the sample engine (synth uses capSynth) */
    solo:    { level: 0.85, send: 0.50, filter: false, cap: 4, capSynth: 10, vib: 0 },
    strings: { level: 0.72, send: 0.42, filter: true,  cap: 5, capSynth: 16, vib: 6, rate: 5.1 },
    winds:   { level: 0.50, send: 0.45, filter: true,  cap: 4, capSynth: 10, vib: 4, rate: 5.6 },
    brass:   { level: 0.52, send: 0.30, filter: true,  cap: 3, capSynth: 12, vib: 5, rate: 5.4 },
    perc:    { level: 0.78, send: 0.26, filter: false, cap: 2, capSynth: 6,  vib: 0 }
  };
  const stats = { userNotes: 0, scheduledNotes: 0, active: 0, peak: 0, stolen: 0, maxLateMs: 0, engine: 'none', synthNotes: 0 };
  const S = { buf: null, offset: 0, ready: false, failed: false, state: 'idle', forceSynth: false };

  /* ---- sprite loading: fetch + decode on page load, with no AudioContext ---- */
  async function loadSprite() {
    if (!SPRITE.url || S.state !== 'idle') return;
    S.state = 'loading'; const t0 = performance.now();
    try {
      const res = await fetch(SPRITE.url, { cache: 'force-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.arrayBuffer(); const bytes = data.byteLength;
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const dec = new OAC(1, 1, SPRITE.rate);
      const buf = await new Promise((ok, no) => { const p = dec.decodeAudioData(data, ok, no); if (p && p.then) p.then(ok, no); });
      /* the sprite starts with a click marker; find it to cancel the MP3 encoder delay */
      const d = buf.getChannelData(0), lim = Math.min(d.length, Math.floor(buf.sampleRate * (SPRITE.marker + 0.2)));   /* stays clear of the first sample */
      let pk = 0, pi = 0; for (let i = 0; i < lim; i++) { const a = Math.abs(d[i]); if (a > pk) { pk = a; pi = i; } }
      S.offset = pi / buf.sampleRate - SPRITE.marker; S.buf = buf; S.ready = true; S.state = 'ready';
      Log.add(`samples ready: ${(bytes / 1048576).toFixed(2)} MB, ${buf.duration.toFixed(1)} s @ ${buf.sampleRate} Hz, offset ${(S.offset * 1000).toFixed(1)} ms, ${Math.round(performance.now() - t0)} ms`);
    } catch (e) {
      S.failed = true; S.state = 'failed';
      Log.add(`samples unavailable (${e && e.message ? e.message : e}) → synth fallback`);
    }
  }
  /* the engine is chosen when the context is created and kept until restart, so levels and caps never change mid-piece */
  let ctxEngine = null;
  const useSamples = () => S.ready && !S.forceSynth && (ctx ? ctxEngine === 'samples' : true);

  /* Create the context. Only ever called from inside a user-gesture handler. */
  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { Log.add('Web Audio API unavailable'); return null; }
    ctxEngine = S.ready && !S.forceSynth ? 'samples' : 'synth';
    ctx = new AC({ latencyHint: 'balanced' });
    Object.assign(stats, { active: 0, peak: 0, stolen: 0, maxLateMs: 0, synthNotes: 0 });
    reverb = null; noiseBuf = null;
    const lat = ctx.baseLatency ? ` · base latency ${(ctx.baseLatency * 1000).toFixed(0)} ms` : '';
    Log.add(`AudioContext created by user gesture (state ${ctx.state}, ${ctx.sampleRate} Hz${lat}) · engine ${useSamples() ? 'samples' : 'synth'}`);
    if (ctx.state === 'suspended') ctx.resume().then(() => Log.add('AudioContext resumed → running')).catch(e => Log.add('resume failed: ' + e));
    /* buses → master → duck → limiter → out. 'direct' carries the pre-mixed final chord. */
    const lim = ctx.createDynamicsCompressor();
    lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.12;
    /* samples are mono and their tails are capped, so they sit ~4 dB under the synth: make up for it */
    master = ctx.createGain(); master.gain.value = 0.62 * (useSamples() ? SAMPLE_MAKEUP : 1);
    duck = ctx.createGain(); duck.gain.value = 1;
    direct = ctx.createGain(); direct.gain.value = 1; direct.connect(master);
    master.connect(duck); duck.connect(lim); lim.connect(ctx.destination);
    for (const [name, def] of Object.entries(BUS)) {
      const inp = ctx.createGain(); let node = inp, filter = null;
      if (def.filter) { filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2600; filter.Q.value = 0.5; inp.connect(filter); node = filter; }
      const level = ctx.createGain(); level.gain.value = def.level;
      node.connect(level); level.connect(master);
      bus[name] = { inp, filter, level, vib: null, def, base: def.level, cap: useSamples() ? def.cap : def.capSynth, intensity: 1, duck: 1, voices: [] };
    }
    stats.engine = useSamples() ? 'samples' : 'synth';
    if (!useSamples()) synthGraph();   /* build reverb now, so the first synth note is not late */
    return ctx;
  }
  /* synth-only nodes, built the first time the synth actually plays */
  function synthGraph() {
    if (reverb) return;
    reverb = ctx.createConvolver(); reverb.buffer = makeIR(2.0);
    const ret = ctx.createGain(); ret.gain.value = 0.55; reverb.connect(ret); ret.connect(master);
    noiseBuf = makeNoise();
    for (const b of Object.values(bus)) {
      const send = ctx.createGain(); send.gain.value = b.def.send; b.level.connect(send); send.connect(reverb);
      if (b.def.vib) { const l = ctx.createOscillator(); l.frequency.value = b.def.rate; b.vib = ctx.createGain(); b.vib.gain.value = b.def.vib; l.connect(b.vib); l.start(); }
    }
    Log.add('synth graph built (reverb + vibrato)');
  }
  function makeIR(sec) {
    const len = Math.floor(ctx.sampleRate * sec); const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) { const x = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 2.9) * (1 - Math.exp(-i / 240)); } }
    return buf;
  }
  function makeNoise() { const b = ctx.createBuffer(1, ctx.sampleRate >> 1, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }

  function applyLevel(name, tc = 0.09) {
    const b = bus[name]; if (!b || !ctx) return; const v = b.intensity, t = ctx.currentTime;
    b.level.gain.setTargetAtTime(b.base * (0.04 + 0.96 * Math.pow(v, 1.5)) * b.duck, t, tc);
    if (b.filter) b.filter.frequency.setTargetAtTime(500 + Math.pow(v, 1.4) * 6500, t, tc);
  }
  function setIntensity(name, v) { const b = bus[name]; if (!b) return; b.intensity = v; applyLevel(name); }
  function setDuck(name, f, tc = 0.14) { const b = bus[name]; if (!b) return; b.duck = f; applyLevel(name, tc); }
  function duckAll(f, tc = 0.18) { if (ctx && duck) duck.gain.setTargetAtTime(f, ctx.currentTime, tc); }

  const G = () => ctx.createGain();
  function osc(type, f, t) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
  function hold(p, t) { if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else p.cancelScheduledValues(t); }
  function steal(v, t) {
    const tau = v.gentle ? 0.045 : 0.012, stop = t + tau * 5;
    v.env.forEach(p => { try { hold(p, t); p.setTargetAtTime(0, t, tau); } catch (_) {} });
    v.srcs.forEach(s => { try { s.stop(stop); } catch (_) {} });
    v.end = stop; stats.stolen++;
  }
  /* register a note on its bus; enforce the cap; keep live counts for the dev overlay */
  function voice(name, t, end, env, srcs, vibbed) {
    const b = bus[name]; stats.scheduledNotes++;
    const lfo = vibbed ? b.vib : null;
    srcs.forEach(s => {
      if (lfo && s.detune) lfo.connect(s.detune);
      stats.active++; if (stats.active > stats.peak) stats.peak = stats.active;
      s.onended = () => { stats.active--; if (lfo && s.detune) { try { lfo.disconnect(s.detune); } catch (_) {} } };
    });
    b.voices = b.voices.filter(v => v.end > t);
    if (b.voices.length >= b.cap) {
      let oldest = 0; for (let i = 1; i < b.voices.length; i++) if (b.voices[i].t < b.voices[oldest].t) oldest = i;
      steal(b.voices[oldest], t); b.voices.splice(oldest, 1);
    }
    b.voices.push({ t, end, env, srcs, gentle: useSamples() });
    if (!(ctx instanceof (window.OfflineAudioContext || function () {}))) {
      const late = ctx.currentTime - t; if (late > 0.002) stats.maxLateMs = Math.max(stats.maxLateMs, late * 1000);
    }
  }

  /* ---- SAMPLE engine: one region of the shared buffer per note ---- */
  function sp(name, busName, t, gain = 1, cut, rel = 0.25) {
    const m = SPRITE.map[name]; if (!m) { Log.add('missing sample ' + name); return; }
    const s = ctx.createBufferSource(); s.buffer = S.buf;
    gain *= m[2] || 1;                                   /* per-sample level stored by the sprite builder */
    const g = G(); g.gain.setValueAtTime(gain, t);
    let len = m[1];
    if (cut !== undefined && cut + rel * 5 < len) { g.gain.setValueAtTime(gain, t + cut); g.gain.setTargetAtTime(0, t + cut, rel); len = cut + rel * 5; }
    s.connect(g); g.connect(busName === 'direct' ? direct : bus[busName].inp);
    s.start(t, Math.max(0, m[0] + S.offset), len);
    voice(busName === 'direct' ? 'solo' : busName, t, t + len, [g.gain], [s], false);
  }

  /* ---- SYNTH engine (v0.2 voices) — also the source the sprite is rendered from ---- */
  const syn = {
    solo(midi, t, vel = 0.8, mode = 'rich') {
      const f = mtof(midi), b = bus.solo, srcs = [], env = [];
      const parts = mode === 'light' ? [['sine', 1, 0.5, 0.35]]
        : mode === 'loop' ? [['sine', 1, 0.62, 0.62], ['triangle', 2, 0.14, 0.30]]
        : [['sine', 1, 0.62, 0.62], ['triangle', 2, 0.14, 0.30], ['sine', 3.003, 0.06, 0.16]];
      let end = t;
      parts.forEach(([type, r, gn, tau]) => {
        const o = osc(type, f * r, t), g = G(), stop = t + tau * 5;

    strings(midi, t, dur, vel = 0.8, saws = 2) {

    bass(midi, t, dur, vel = 0.9) {

    },
    winds(midi, t, dur, vel = 0.6, breath = true) {

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22 * vel, t + 0.035); g.gain.setTargetAtTime(0, t + dur, 0.07);

        const ng = G(); ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(0.03 * vel, t + 0.012); ng.gain.setTargetAtTime(0, t + 0.02, 0.03);

    },
    brass(notes, t, dur, vel = 0.6) {

    solo(midi, t, vel = 0.85) { if (useSamples()) return sp('solo_' + midi, 'solo', t, vel); synthGraph(); stats.synthNotes++; syn.solo(midi, t, vel, 'rich'); },

    padHi(chord, t, dur) {

    stringsMel(midi, t, dur) {

    winds(midi, t, dur, short, breath) {

    brassPair(chord, t, dur) {

/* ---------------- Clock ---------------- */
/* One lookahead scheduler drives every section. Tempo changes alter the length of
   FUTURE steps only, so already-scheduled notes never shift and no layer drifts.
   v0.2: 350 ms lookahead (was 160 ms) so a busy main thread on the glasses cannot
   starve the audio schedule. */
const Clock = (() => {
  const S = { bpm: 84, running: false, step: 0, nextTime: 0, timer: null, startedAt: null,
              beats: [], lookahead: 0.35, interval: 25, rit: null, lastTick: 0, maxGapMs: 0, resyncs: 0 };
  const stepDur = () => 60 / S.bpm / 4;
  function tick() {
    const ctx = Audio.ctx(); if (!ctx || !S.running) return;
    const p = performance.now(); if (S.lastTick) S.maxGapMs = Math.max(S.maxGapMs, p - S.lastTick); S.lastTick = p;
    const now = ctx.currentTime;
    if (S.nextTime < now - 0.35) {           /* timer was starved: resync on the grid */
      const missed = Math.floor((now - S.nextTime) / stepDur()) + 1;
      S.step += missed; S.nextTime += missed * stepDur(); S.resyncs++;
      Log.add(`clock resynced (+${missed} steps)`);
    }
    while (S.running && S.nextTime < now + S.lookahead) {
      const t = S.nextTime, st = S.step;
      if (st % 4 === 0) { S.beats.push({ t, idx: (st / 4) | 0 }); if (S.beats.length > 24) S.beats.shift(); }
      if (S.rit && st >= S.rit.start) S.bpm = Math.max(36, S.bpm * S.rit.factor);
      Layers.onStep(st, t, stepDur());
      S.step++; S.nextTime += stepDur();
    }
  }
  return {
    get bpm() { return S.bpm; },
    set bpm(v) { S.bpm = clamp(v, 60, 140); },
    get step() { return S.step; }, get running() { return S.running; }, get startedAt() { return S.startedAt; },
    get maxGapMs() { return S.maxGapMs; }, get resyncs() { return S.resyncs; }, get lookahead() { return S.lookahead; },
    stepDur, beatDur: () => 60 / S.bpm,
    start(at) {
      S.step = 0; S.nextTime = at; S.startedAt = at; S.running = true; S.rit = null; S.beats = []; S.lastTick = 0; S.maxGapMs = 0;
      clearInterval(S.timer); S.timer = setInterval(tick, S.interval); tick();
      Log.add(`clock started at ${at.toFixed(3)}s · ${S.bpm} bpm`);
    },
    stop() { S.running = false; clearInterval(S.timer); S.timer = null; },
    pause() { clearInterval(S.timer); S.timer = null; S.lastTick = 0; },
    resume() { if (S.running && !S.timer) S.timer = setInterval(tick, S.interval); },
    nextBarStep() { return Math.ceil(S.step / 16) * 16; },
    setRit(start, factor) { S.rit = { start, factor }; },
    beat(now) {
      for (let i = S.beats.length - 1; i >= 0; i--) {
        const b = S.beats[i]; if (b.t <= now) return { idx: b.idx, phase: clamp((now - b.t) / (60 / S.bpm), 0, 1) };
      }
      return null;
    },
    reset() { this.stop(); S.bpm = 84; S.step = 0; S.startedAt = null; S.beats = []; S.rit = null; S.maxGapMs = 0; S.resyncs = 0; }
  };
})();

/* ---------------- Layers ---------------- */
const Layers = (() => {
  const L = {};
  ['solo', 'strings', 'winds', 'brass', 'perc'].forEach(n => L[n] = { joined: false, joinStep: 0, lastStep: -1, lastT: 0 });
  const St = { mode: 'phrase', phase: 0, pendingPhase: null, finalStep: null, rollFrom: null, done: false };
  const A = Audio.play;
  const active = (name, step) => L[name].joined && step >= L[name].joinStep;
  const ev = (t, section, midi, vel, kind) => Visual.queue.push({ t, section, midi, vel, kind });
  const mark = (name, step, t) => { L[name].lastStep = step; L[name].lastT = t; };
  const windsUp = chord => [...chord.tones, chord.tones[0] + 12].map(n => n + 12);

  function onStep(step, t, dur) {
    if (St.done) return;
    const pos = step % 16, bar = Math.floor(step / 16), chord = Score.chordAtBar(bar), mpos = step % 32;
    if (pos === 0 && St.pendingPhase !== null) {
      St.phase = St.pendingPhase; St.pendingPhase = null;
      Log.add(`finale phase ${St.phase} from bar ${bar}`); Game.onPhase(St.phase, t);
    }
    if (St.finalStep !== null && step === St.finalStep) {
      A.final(t); finalEvents(t); St.done = true; Clock.stop(); Game.onFinalChord(t); return;
    }
    const finale = St.mode === 'finale';
    const mi = Score.melodyStarts.indexOf(mpos);

    if (active('solo', step)) {
      if (mi >= 0) { const m = Score.melody[mi]; A.melody(m.n, t, finale); ev(t, 'solo', m.n, 0.75); }
      mark('solo', step, t);
    }
    if (active('strings', step)) {
      if (pos === 0) { A.pad(chord, t, dur * 16); ev(t, 'strings', chord.tones[0], 0.8); }
      if (finale && pos === 8) { A.padHi(chord, t, dur * 8); ev(t, 'strings', chord.tones[2] + 12, 0.5); }
      if (St.phase >= 2 && mi >= 0) { const m = Score.melody[mi]; A.stringsMel(m.n - 12, t, dur * m.len); }
      mark('strings', step, t);
    }
    if (active('winds', step)) {
      const up = windsUp(chord);
      if (finale) { const seq = [0, 1, 2, 3, 2, 1]; const n = up[seq[pos % 6]]; A.winds(n, t, dur * 1.1, true, pos % 4 === 0); ev(t, 'winds', n, 0.5); }
      else if (pos % 2 === 0) { const seq = [0, 1, 2, 3, 2, 1, 0, 1]; const n = up[seq[pos / 2]]; A.winds(n, t, dur * 2.1, false, pos % 4 === 0); ev(t, 'winds', n, 0.62); }
      mark('winds', step, t);
    }
    if (active('brass', step)) {
      if (finale) {
        const hits = { 0: ['L', 6], 6: ['S', 2], 8: ['M', 4], 12: ['M', 4] };
        if (hits[pos]) { A.brassHit(chord, hits[pos][0], t, dur * hits[pos][1] * 0.9); ev(t, 'brass', chord.tones[0], pos === 0 ? 0.85 : 0.62); }
      } else if (pos === 0 || pos === 8) { A.brassPair(chord, t, dur * 4); ev(t, 'brass', chord.root + 12, 0.55); }
      mark('brass', step, t);
    }
    if (St.phase >= 2 && active('perc', step)) {
      if (pos === 0 || pos === 8) { A.timpani(chord.root - 12, t, pos === 0 ? 0.9 : 0.6); ev(t, 'perc', chord.root, 0.8); }
      mark('perc', step, t);
    }
    if (St.rollFrom !== null && step >= St.rollFrom && step < St.finalStep) {
      const k = (step - St.rollFrom) / 8; A.timpani(38, t, 0.35 + 0.6 * k); ev(t, 'perc', 38, 0.4 + 0.5 * k);
    }
  }
  function finalEvents(t) {
    ev(t, 'solo', 86, 1, 'final'); ev(t, 'strings', 74, 1); ev(t, 'winds', 86, 1); ev(t, 'brass', 69, 1); ev(t, 'perc', 38, 1);
    Log.add(`final chord at ${t.toFixed(3)}s`);
  }
  /* A section joins on the very next scheduler step; strings and brass also fill
     the rest of the current bar immediately so the gesture is heard at once. */
  function join(name) {
    const l = L[name]; if (l.joined) return;
    l.joined = true; l.joinStep = Clock.step;
    const ctx = Audio.ctx();
    if (Clock.running && ctx) {
      const t = ctx.currentTime + 0.03, step = Clock.step, pos = step % 16, bar = Math.floor(step / 16);
      const chord = Score.chordAtBar(bar), remaining = (16 - pos) % 16, dur = remaining * Clock.stepDur();
      if (name === 'strings' && pos !== 0) { A.pad(chord, t, dur); ev(t, 'strings', chord.tones[0], 0.8); }
      if (name === 'brass' && pos % 8 !== 0) { A.brassPair(chord, t, Math.min(dur, 4 * Clock.stepDur())); ev(t, 'brass', chord.root + 12, 0.55); }
    }
    Log.add(`${name} joined at step ${l.joinStep}`);
  }
  return {
    onStep, join, state: St, layers: L, windsUp,
    setMode(m) { St.mode = m; },
    setPhase(p) { St.pendingPhase = p; },
    resolve() {
      const start = Clock.nextBarStep();
      Clock.setRit(start, 0.982); St.rollFrom = start + 8; St.finalStep = start + 16;
      Log.add(`resolution: ritardando from step ${start}, final chord at step ${St.finalStep}`);
    },
    reset() {
      for (const n in L) Object.assign(L[n], { joined: false, joinStep: 0, lastStep: -1, lastT: 0 });
      Object.assign(St, { mode: 'phrase', phase: 0, pendingPhase: null, finalStep: null, rollFrom: null, done: false });
    }
  };
})();

/* ---------------- Gestures ---------------- */
/* A line-art right hand seen from the thumb side, fingers pointing left. It shows the
   Meta Neural Band gestures the glasses turn into input events:
     pinch    thumb taps index finger          → Enter
     swipeLR  thumb slides along index finger  → ArrowLeft / ArrowRight
     swipeUD  thumb slides up / down on it     → ArrowUp / ArrowDown
     drag     pinch held while the hand moves  → pointer events (opt-in)
     back     thumb taps middle finger         → Escape / history back
   The guide reacts to input EVENTS only. It never claims to see the wearer's hand.
   SWIPE_FLIP: set true if the glasses map "thumb toward fingertip" to ArrowRight. */
const Gestures = (() => {
  const SWIPE_FLIP = false;
  const CY = [94, 231, 255], IV = [246, 241, 227], GO = [242, 199, 107];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a, 0, 1)})`;
  const INFO = {
    pinch:   { name: 'Pinch',        how: 'Tap your thumb to your index finger', period: 1.6 },
    swipeLR: { name: 'Swipe',        how: 'Slide your thumb along your index finger', period: 2.6 },
    swipeUD: { name: 'Swipe',        how: 'Slide your thumb up or down on your index finger', period: 2.6 },
    drag:    { name: 'Pinch & drag', how: 'Hold the pinch and move your hand', period: 2.8 },
    back:    { name: 'Back',         how: 'Tap your thumb to your middle finger', period: 1.8 }
  };
  const ACTION = { select: 'pinch', left: 'swipeLR', right: 'swipeLR', up: 'swipeUD', down: 'swipeUD', dragstart: 'drag', drag: 'drag', back: 'back' };

  /* ----- skeleton ----- */
  const LEN = { index: [26, 18, 14], middle: [27, 19, 15], ring: [22, 14, 10], thumb: [30, 28] };
  const BASE = { index: { x: 0, y: 4 }, middle: { x: 4, y: 15 }, ring: { x: 10, y: 26 }, thumb: { x: 34, y: 10 } };
  const CURL = { index: [0.20, 0.60, 1.00], middle: [0.35, 0.95, 1.55], ring: [0.70, 1.65, 2.45] };
  const THENAR = { x: 44, y: 16 };
  function chain(b, lens, curl, k, lift = 0) {
    const pts = [{ x: b.x, y: b.y }]; let p = pts[0];
    for (let i = 0; i < lens.length; i++) { const a = Math.PI - curl[i] * k + lift; p = { x: p.x + lens[i] * Math.cos(a), y: p.y + lens[i] * Math.sin(a) }; pts.push(p); }
    return pts;
  }
  function ik(B, T, L1, L2) {
    const dx = T.x - B.x, dy = T.y - B.y; const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 0.5, L1 + L2 - 0.5);
    const a = Math.atan2(dy, dx); const A = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    const J = { x: B.x + L1 * Math.cos(a + A), y: B.y + L1 * Math.sin(a + A) };
    return [B, J, { x: B.x + d * Math.cos(a), y: B.y + d * Math.sin(a) }];
  }
  const P = (x, y) => ({ x, y }), mix = (p, q, k) => P(lerp(p.x, q.x, k), lerp(p.y, q.y, k));
  const THUMB_REST = P(-39, 0);
  /* the thumb's base knuckle follows its tip a little, like a real metacarpal */
  function thumb(T) {
    const B = BASE.thumb, L = LEN.thumb[0] + LEN.thumb[1], d = Math.hypot(T.x - B.x, T.y - B.y);
    const k = clamp(1 - (L * 0.9) / Math.max(d, 1), 0, 0.8);   /* keep the thumb long and gently bent */
    return ik(P(B.x + (T.x - B.x) * k, B.y + (T.y - B.y) * k), T, LEN.thumb[0], LEN.thumb[1]);
  }
  function along(pts, u) { const i = clamp(Math.floor(u), 0, pts.length - 2), k = u - i; return { p: mix(pts[i], pts[i + 1], k), d: P(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y) }; }

/* ---------------- Nav ---------------- */
/* The docs say the Back gesture arrives as Escape or as history.back(). When a popup
   opens we add ONE history entry; if the system goes back through history, popstate
   fires and we close the popup instead of leaving the app. We never call
   history.back() ourselves, so a Back can never be applied twice. */
const Nav = (() => {
  let depth = 0;
  return {
    ensure() { if (depth) return; try { history.pushState({ conductor: VERSION }, ''); depth = 1; } catch (_) {} },
    get depth() { return depth; },
    init() { window.addEventListener('popstate', () => { if (!depth) return; depth = 0; Log.add('history back → Back'); Input.dispatch('back', undefined, 'history'); }); }
  };
})();

/* ---------------- Input ---------------- */
/* Glasses deliver pinch → Enter, d-pad swipes → Arrow keys, back → Escape.
   Space is a desktop-only alias for Enter. Key auto-repeat and duplicate keydowns
   are ignored; the same action cannot fire twice within 80 ms. */
const Input = (() => {
  const MAP = { Enter: 'select', ' ': 'select', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Escape: 'back' };
  const held = new Set(), last = {}, listeners = [], MIN_GAP = 80;
  const I = { dragEnabled: false, dragThreshold: 8 };
  function emit(action, src, data) {
    const now = performance.now();
    if (action !== 'drag' && last[action] && now - last[action] < MIN_GAP) { Log.add(`ignored rapid ${action} (${src})`); return; }
    last[action] = now; listeners.forEach(fn => fn(action, src, data));
  }
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'd' || e.key === 'D') { Dev.toggle(); e.preventDefault(); return; }
    const a = MAP[e.key]; if (!a) return;
    e.preventDefault();
    if (e.repeat || held.has(e.key)) return;
    held.add(e.key); setTimeout(() => held.delete(e.key), 700);
    emit(a, 'key');
  }
  let drag = null;
  function onDown(e) { if (!I.dragEnabled || e.button > 0) return; drag = { id: e.pointerId, x0: e.clientX, x: e.clientX, moved: false }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} }

    const dx = e.clientX - drag.x; drag.x = e.clientX; if (dx !== 0) emit('drag', 'pointer', dx);
  }

    on(fn) { listeners.push(fn); }, get dragEnabled() { return I.dragEnabled; }, set dragEnabled(v) { I.dragEnabled = v; },
    init(el) {
      window.addEventListener('keydown', onKey); window.addEventListener('keyup', e => held.delete(e.key));
      window.addEventListener('blur', () => held.clear());
      el.addEventListener('pointerdown', onDown); el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp); el.addEventListener('pointercancel', onUp);

    /* programmatic entry point used by tests and history back; goes through the same guards */
    dispatch(action, data, src = 'api') { emit(action, src, data); }
  };
})();

/* ---------------- Game ---------------- */
const Game = (() => {
  const SECTIONS = ['strings', 'winds', 'brass'];
  const NAME = { strings: 'strings', winds: 'woodwinds', brass: 'brass' };
  const LABEL = { strings: 'Strings', winds: 'Woodwinds', brass: 'Brass' };
  const CH = ['Overture', 'Chapter I · The First Note', 'Chapter II · Find Your Orchestra', 'Chapter III · Step Back',
              'Chapter IV · Shape the Music', 'Chapter V · Conduct the Tempo', 'Chapter VI · The Finale'];
  const HINT_MS = 7000;
  const fresh = () => ({ chapter: 0, focus: 0, melodyIndex: 0, joined: {}, intensity: { strings: 0.5, winds: 0.5, brass: 0.5 },
    finalePhase: 0, ended: false, timers: [], challengeDone: false, cued: false, resolveReady: false, busy: false,
    card: null, backCount: 0, pause: false, saved: null, lastInput: performance.now() });
  const G = fresh();
  const el = { eyebrow: $('#eyebrow'), prompt: $('#prompt'), readout: $('#readout'), wordmark: $('#wordmark'), tagline: $('#tagline'), bravo: $('#bravo'),

  /* timers wait while the pause popup is open */
  const later = (fn, ms) => { const run = () => { if (G.pause) { G.timers.push(setTimeout(run, 400)); return; } fn(); }; G.timers.push(setTimeout(run, ms)); };
  const clearTimers = () => { G.timers.forEach(clearTimeout); G.timers = []; };
  const focusName = () => SECTIONS[G.focus];
  const tempoMark = bpm => bpm < 72 ? 'Adagio' : bpm < 92 ? 'Andante' : bpm < 108 ? 'Moderato' : bpm < 130 ? 'Allegro' : 'Vivace';
  const show = (e, on) => { if (on) { e.hidden = false; requestAnimationFrame(() => e.classList.add('show')); } else { e.classList.remove('show'); setTimeout(() => { if (!e.classList.contains('show')) e.hidden = true; }, 320); } };

  function prompt(html, instant) {
    if (instant) { el.prompt.classList.remove('swap'); el.prompt.innerHTML = html; return; }
    el.prompt.classList.add('swap');
    later(() => { el.prompt.innerHTML = html; el.prompt.classList.remove('swap'); }, 220);
  }
  function readout() { el.readout.innerHTML = G.chapter < 2 ? '' : `♩ <b>${Math.round(Clock.bpm)}</b> ${tempoMark(Clock.bpm)}`; }
  function energy() {
    const joined = SECTIONS.filter(s => G.joined[s]);
    const e = joined.length ? joined.reduce((a, s) => a + G.intensity[s], 0) / SECTIONS.length : 0;
    Visual.state.energy = clamp(0.08 * (G.chapter >= 1 ? 1 : 0) + e * 0.75 + (Clock.bpm - 84) / 56 * 0.15 + (G.finalePhase >= 2 ? 0.1 : 0), 0, 1);
    return joined.length ? joined.reduce((a, s) => a + G.intensity[s], 0) / joined.length : 0;
  }

    Visual.state.focus = G.chapter >= 2 && !G.ended ? focusName() : null; energy(); readout();
  }
  function enter(n, dock) {
    G.chapter = n; G.busy = false; el.eyebrow.textContent = CH[n]; Gestures.setDock(dock);
    Input.dragEnabled = n >= 5; G.lastInput = performance.now(); syncVisual(); Log.add(`→ ${CH[n]}`);
  }
  /* which gesture moves the lesson forward right now (drives hints) */
  function expected() {
    if (G.busy || G.pause) return null;
    if (G.ended) return 'pinch';
    switch (G.chapter) {
      case 0: case 1: return G.melodyIndex < 8 ? 'pinch' : null;

      case 3: return G.card ? 'back' : 'pinch';
      case 4: return G.joined[focusName()] && G.intensity[focusName()] < 1 ? 'swipeUD' : 'swipeLR';

  function playMelodyNote() {
    const ctx = Audio.ensure(); if (!ctx) return;

    Audio.play.solo(m.n, t, 0.85); Audio.stats.userNotes++;

  }
  function melodyComplete() {
    const ctx = Audio.ctx(); const at = ctx.currentTime + 0.55;
    Layers.layers.solo.joined = true; Layers.layers.solo.joinStep = 0;
    Clock.start(at); G.busy = true;
    prompt('That melody is yours.<br>Listen — it plays on.');
    later(enter2, 5200);
  }
  /* ---- Chapter II: swipe to navigate ---- */
  function enter2() {
    enter(2, [{ key: 'swipeLR', label: 'Choose section' }, { key: 'pinch', label: 'Bring it in' }]); G.focus = 0; syncVisual();
    Gestures.teach('swipeLR');
    prompt('Swipe to find a section.<br>Pinch to bring it in.');
  }
  function moveFocus(dir) { G.focus = (G.focus + dir + SECTIONS.length) % SECTIONS.length; syncVisual(); Log.add(`focus → ${focusName()}`); }
  function joinFocused() {
    const s = focusName();
    if (G.joined[s]) { Visual.cue(Visual.COL[s]); return; }
    G.joined[s] = true; Audio.setIntensity(s, G.intensity[s]); Layers.join(s);
    Visual.cue(Visual.COL[s]); syncVisual();
    const count = SECTIONS.filter(x => G.joined[x]).length;
    if (count === SECTIONS.length) { G.busy = true; prompt('Your orchestra is complete.'); later(enter3, 3600); }
    else {
      const left = SECTIONS.filter(x => !G.joined[x]).map(x => NAME[x]);
      prompt(`The ${NAME[s]} have joined.<br>Still waiting: <em>${left.join(' and ')}</em>.`);
    }
  }
  /* ---- Chapter III: Back ---- */
  function enter3() {
    enter(3, [{ key: 'swipeLR', label: 'Section' }, { key: 'pinch', label: 'Open card' }]); G.backCount = 0;
    Gestures.pulse('pinch');
    prompt('Pinch to open a section’s card.<br>Then learn how to close it.');
  }
  function openCard() {
    const s = focusName(); G.card = s; Nav.ensure();
    const ctx = Audio.ctx(); const t = ctx.currentTime + 0.01;
    for (const o of [...SECTIONS, 'solo']) if (o !== s) Audio.setDuck(o, 0.12);
    Audio.play.solo(81, t, 0.32); Visual.queue.push({ t, section: s, midi: 81, vel: 0.6 }); Visual.cue(Visual.COL[s]);
    Visual.state.solo_section = s; Visual.state.dimTarget = 0.55;
    el.cardK.textContent = LABEL[s]; el.cardT.textContent = `${LABEL[s]} alone`; el.cardB.textContent = 'Only this section is playing now.';
    show(el.card, true);
    Gestures.setDock([{ key: 'back', label: 'Close card' }]);
    if (G.backCount === 0) { Gestures.teach('back'); prompt('<em>Back</em> closes what you opened<br>and returns you one step.'); }
    else prompt('Now close it with <em>Back</em>.');
    Log.add(`card opened: ${s}`);
  }
  function closeCard() {
    const s = G.card; G.card = null;
    const ctx = Audio.ctx(); const t = ctx.currentTime + 0.01;
    for (const o of [...SECTIONS, 'solo']) Audio.setDuck(o, 1, 0.2);
    Audio.play.solo(78, t, 0.28); Audio.play.solo(74, t + 0.1, 0.3); Visual.queue.push({ t, section: 'solo', midi: 74, vel: 0.5 }); Visual.cue();
    Visual.state.solo_section = null; Visual.state.dimTarget = 1;
    show(el.card, false); G.backCount++; Log.add(`card closed: ${s} (${G.backCount})`);
    if (G.backCount === 1) {
      Gestures.setDock([{ key: 'swipeLR', label: 'Section' }, { key: 'pinch', label: 'Open' }, { key: 'back', label: 'Close' }]);
      prompt('That is <em>Back</em> — one step out.<br>Once more on your own: open, then close.');
    } else {
      G.busy = true; Gestures.setDock([{ key: 'pinch', label: 'Go in' }, { key: 'back', label: 'Come out' }]);
      prompt('Pinch goes in. <em>Back</em> comes out.');
      later(enter4, 3600);
    }
  }
  /* ---- Pause popup: Back from the main stage ---- */
  function openPause() {
    G.pause = true; Nav.ensure(); Audio.duckAll(0.3); Visual.state.dimTarget = 0.25;
    G.saved = { prompt: el.prompt.innerHTML }; el.prompt.classList.add('swap');
    show(el.pause, true); Gestures.hold(true); Gestures.setExtra([{ key: 'pinch', x: 204, y: 282 }, { key: 'back', x: 204, y: 346 }]);
    G.savedDock = G.dockCache; Gestures.setDock([]); Log.add('pause opened');
  }
  function closePause() {
    G.pause = false; Audio.duckAll(1); Visual.state.dimTarget = G.card ? 0.55 : 1;
    show(el.pause, false); Gestures.hold(false); Gestures.setExtra([]); el.prompt.innerHTML = G.saved.prompt; el.prompt.classList.remove('swap');
    Gestures.setDock(G.savedDock || []); Log.add('pause closed');
  }
  /* ---- Chapter IV ---- */
  function enter4() {
    enter(4, [{ key: 'swipeLR', label: 'Section' }, { key: 'swipeUD', label: 'Dynamics' }]); G.challengeDone = false; G.focus = 0; syncVisual();
    Gestures.teach('swipeUD');
    prompt('Swipe up to raise the <em>strings</em>.<br>Build the crescendo.');
  }
  function adjustIntensity(dir) {
    const s = focusName(); if (!G.joined[s]) return;
    const v = clamp(Math.round((G.intensity[s] + dir * 0.125) * 1000) / 1000, 0, 1);
    if (v === G.intensity[s]) { Visual.cue(Visual.COL[s]); return; }
    G.intensity[s] = v; Audio.setIntensity(s, v); Visual.cue(Visual.COL[s]);
    Visual.state.sectionPulse[s] = 1; syncVisual(); Log.add(`${s} intensity → ${v.toFixed(3)}`);
    if (G.chapter === 4 && !G.challengeDone) {
      if (energy() >= 0.78) { G.challengeDone = true; G.busy = true; prompt('<em>Fortissimo.</em> The hall is full.'); later(enter5, 3400); }
      else if (v >= 0.99) {
        const next = SECTIONS.find(x => G.intensity[x] < 0.9);
        if (next) prompt(`Now the <em>${NAME[next]}</em>.<br>Swipe ${SECTIONS.indexOf(next) > G.focus ? 'right' : 'left'}, then up.`);
      }
    }
  }
  /* ---- Chapter V ---- */
  function enter5() {
    enter(5, [{ key: 'drag', label: 'Sweep tempo' }, { key: 'swipeUD', label: 'Tempo' }]); G.challengeDone = false; syncVisual();
    Gestures.teach('drag');
    prompt('Pinch, hold, and move your hand right<br>to bring the orchestra to <em>Allegro</em>.');
  }
  function setTempo(v, silent) {
    const before = Clock.bpm; Clock.bpm = v;
    if (Clock.bpm !== before) { syncVisual(); if (!silent) Log.add(`tempo → ${Clock.bpm.toFixed(1)} bpm`); }
    if (G.chapter === 5 && !G.challengeDone && Clock.bpm >= 108) {
      G.challengeDone = true; G.busy = true; prompt('<em>Allegro.</em> Your orchestra follows every move.'); later(enter6, 3400);
    }
  }
  /* ---- Chapter VI: finale ---- */
  function enter6() {
    enter(6, [{ key: 'pinch', label: 'Cue' }, { key: 'swipeLR', label: 'Section' }, { key: 'swipeUD', label: 'Dynamics' }]);
    G.finalePhase = 1; G.cued = false; Layers.setMode('finale'); Layers.setPhase(1); syncVisual();
    prompt('The finale begins.<br>Pinch to cue the full orchestra.');
  }
  function cueFinale() { if (G.cued) return; G.cued = true; G.joined.perc = true; Layers.join('perc'); Layers.setPhase(2); Visual.cue(Visual.COL.brass); prompt('The orchestra gathers…'); }
  function onPhase(p) {
    G.finalePhase = p; syncVisual();
    if (p === 2) later(() => { prompt('Everything you learned, in one movement.<br>Pinch to bring it home.'); G.resolveReady = true; }, 900);
  }
  function resolve() { if (!G.resolveReady) return; G.resolveReady = false; G.cued = true; G.busy = true; Layers.resolve(); Visual.cue(Visual.COL.solo); prompt(''); }
  function onFinalChord(t) {
    const ctx = Audio.ctx(); const delay = Math.max(0, (t - ctx.currentTime) * 1000);
    later(() => {
      el.bravo.classList.add('show'); G.ended = true; syncVisual(); Log.add('performance complete');
      Gestures.setDock([]);
      later(() => { el.bravo.classList.remove('show'); G.busy = false; G.lastInput = performance.now(); prompt('Your first note became a whole orchestra.<br>Pinch to conduct again.'); Gestures.setDock([{ key: 'pinch', label: 'Conduct again' }]); }, 4200);
    }, delay + 60);
  }
  /* ---- restart ---- */
  function reset() {
    clearTimers(); Clock.reset(); Audio.shutdown(); Layers.reset(); Visual.reset(); Gestures.reset();
    Object.assign(G, fresh());
    el.bravo.classList.remove('show'); el.wordmark.classList.remove('gone'); el.tagline.classList.remove('gone');
    show(el.card, false); show(el.pause, false);
    enter(0, []); Gestures.teach('pinch'); prompt('Your orchestra is waiting.<br>Pinch once to give your first cue.', true);
    Log.add('restarted — silent until the next pinch');
  }

  function onAction(a, src, data) {
    G.lastInput = performance.now();
    if (!G.pause) Gestures.input(a); else Gestures.flashOnly(a);
    if (G.pause) { if (a === 'select') reset(); else if (a === 'back') closePause(); return; }
    if (a === 'back') {
      if (G.card) closeCard();
      else if (G.chapter >= 1 && !G.ended) openPause();
      return;
    }
    if (G.ended) { if (a === 'select' && !G.busy) reset(); return; }
    const exp = expected();
    switch (G.chapter) {
      case 0: if (a === 'select') firstCue(); else Gestures.pulse('pinch'); return;
      case 1:
        if (a === 'select' && G.melodyIndex < Score.melody.length) { playMelodyNote(); if (G.melodyIndex === Score.melody.length) melodyComplete(); }
        break;
      case 2:
        if (a === 'left') moveFocus(-1); else if (a === 'right') moveFocus(1); else if (a === 'select') joinFocused();
        break;
      case 3:
        if (G.card) { Gestures.pulse('back'); if (a !== 'back' && G.backCount === 0 && !Gestures.showing()) Gestures.teach('back', { hint: true }); return; }
        if (a === 'left') moveFocus(-1); else if (a === 'right') moveFocus(1); else if (a === 'select' && !G.busy) openCard();
        break;
      case 4:
        if (a === 'left') moveFocus(-1); else if (a === 'right') moveFocus(1);
        else if (a === 'up') adjustIntensity(1); else if (a === 'down') adjustIntensity(-1);
        else if (a === 'select') Visual.cue(Visual.COL[focusName()]);
        break;
      case 5:
        if (a === 'up') setTempo(Clock.bpm + 4); else if (a === 'down') setTempo(Clock.bpm - 4);
        else if (a === 'drag') setTempo(Clock.bpm + data * 0.22, true); else if (a === 'dragend') Log.add(`drag ended · ${Clock.bpm.toFixed(1)} bpm`);
        else if (a === 'left') moveFocus(-1); else if (a === 'right') moveFocus(1);
        break;
      case 6:
        if (a === 'select') { if (G.resolveReady) resolve(); else cueFinale(); }
        else if (a === 'left') moveFocus(-1); else if (a === 'right') moveFocus(1);
        else if (a === 'up') adjustIntensity(1); else if (a === 'down') adjustIntensity(-1);
        else if (a === 'drag') setTempo(Clock.bpm + data * 0.22, true);
        break;
    }
    /* a gesture that did not move the lesson forward: nudge the one that will */
    const g = Gestures.ACTION[a];
    if (exp && g && g !== exp && !(exp === 'drag' && g === 'swipeUD')) Gestures.pulse(exp);
  }
  function idleCheck() {
    const exp = expected();
    if (!exp || Gestures.showing()) return;
    if (performance.now() - G.lastInput > HINT_MS) { Gestures.teach(exp, { hint: true }); G.lastInput = performance.now(); }
  }
  return {
    state: G, onPhase, onFinalChord, reset, expected,
    start() {
      /* cache the current dock so the pause popup can restore it */
      const sd = Gestures.setDock; Gestures.setDock = items => { if (!G.pause) G.dockCache = items; sd(items); };
      Audio.loadSprite();
      Visual.init($('#c')); Input.init($('#stage')); Nav.init(); Input.on(onAction);
      enter(0, []); Gestures.teach('pinch');
      setInterval(idleCheck, 500);
      document.addEventListener('visibilitychange', () => {
        Log.add(`visibility → ${document.visibilityState}`);
        if (document.hidden) { Clock.pause(); Audio.suspend(); } else { Audio.resume(); Clock.resume(); }
      });
      window.addEventListener('pagehide', () => { Clock.stop(); Audio.shutdown(); });
      $('#stage').focus({ preventScroll: true });
      Log.add(`v${VERSION} ready · silent · waiting for the first pinch`);
    }
  };
})();

/* ---------------- Dev overlay ---------------- */
const Dev = (() => {
  const box = $('#dev'); let on = false, timer = null;
  function render() {
    const ctx = Audio.ctx(); const L = Layers.layers; const G = Game.state; const st = Audio.stats;
    const lines = [`<h4>CONDUCTOR v${VERSION}</h4>`];
    lines.push(`engine: ${st.engine} · samples ${Audio.sprite.state}` + (st.synthNotes ? ` · synth notes ${st.synthNotes}` : ''));
    lines.push(ctx ? `audio: ${ctx.state} · ${ctx.sampleRate} Hz` + (ctx.baseLatency ? `\nlatency: base ${(ctx.baseLatency * 1000).toFixed(0)} ms` + (ctx.outputLatency ? ` · out ${(ctx.outputLatency * 1000).toFixed(0)} ms` : '') : '') : 'audio: none (created on first pinch)');
    lines.push(`sources allocated ${st.active} · peak ${st.peak}\n(incl. ${Clock.lookahead * 1000} ms scheduled ahead) · stolen ${st.stolen}\nuser notes ${st.userNotes} · scheduled ${st.scheduledNotes}\nlate notes max ${st.maxLateMs.toFixed(1)} ms`);
    lines.push(`<h4>Clock</h4>` + (Clock.running ? `${Clock.bpm.toFixed(1)} bpm · step ${Clock.step} · bar ${Math.floor(Clock.step / 16)}\nlookahead ${Clock.lookahead * 1000} ms · max timer gap ${Clock.maxGapMs.toFixed(0)} ms\nresyncs ${Clock.resyncs}` : 'stopped'));
    lines.push(`<h4>Layers</h4>`);
    for (const [n, l] of Object.entries(L)) lines.push(`${n.padEnd(8)} ${l.joined ? 'on ' : 'off'} last ${String(l.lastStep).padStart(4)} @${l.lastT.toFixed(3)}`);
    lines.push(`<h4>Game</h4>ch ${G.chapter} · focus ${['strings', 'winds', 'brass'][G.focus]} · expects ${Game.expected() || '—'}\ncard ${G.card || '—'} · pause ${G.pause} · back ${G.backCount}`);
    lines.push(`<h4>Log</h4>` + Log.lines.slice(-11).join('\n'));
    box.innerHTML = lines.join('\n');
  }
  return { toggle(force) { on = force === undefined ? !on : force; box.hidden = !on; clearInterval(timer); if (on) { render(); timer = setInterval(render, 250); } }, get on() { return on; } };
})();

Game.start();
if (location.hash === '#dev') Dev.toggle(true);
window.CONDUCTOR = { Audio, Clock, Layers, Visual, Gestures, Nav, Input, Game, Log, Score, Dev, version: VERSION };
</script>
</body>
</html>
